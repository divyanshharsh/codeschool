# Render Blueprint for Backend Deployment
# Deploy at: https://dashboard.render.com

services:
  - type: web
    name: codeschool-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add your other environment variables in Render dashboard

